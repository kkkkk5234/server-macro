<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nạp tiền - Momo / Thẻ</title>
  <style>
    :root{
      --bg:#f6f8fa;
      --card:#fff;
      --accent:#0b84ff;
      --muted: #000dff;
    }
    *{
      box-sizing:border-box
    }
    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      margin:0;
      background:url(background3.jpg);
      background-size: cover;
      color:#111
    }
    .container{
      max-width:980px;
      margin:32px auto;
      padding:16px;
      border-radius: 9px;
      border: 2px solid rgb(188, 185, 185);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(9px);
    }
    .card{
      border-radius:12px;
      box-shadow:0 6px 18px rgba(17,24,39,0.06);
      padding:18px;
    }
    h1{
      margin:0 0 12px;
      font-size:20px;
      color: white;
    }
    p {
      color: white;
    }
    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:14px
    }
    .tab{
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
      border:1px solid transparent
    }
    .tab.active{
      background:linear-gradient(90deg,var(--accent),);
      color: #e6e9ef;
    }
    form{
      display:grid;
      gap:10px;
    }
    label{
      font-size:13px;
      color: var(--card);
    }
    strong{
      color: white;
    }
    input,select,button,textarea{
      padding:10px;
      border-radius:8px;
      border:1px solid #e6e9ef;
      font-size:14px}
    .row{
      display:flex;
      gap:10px}
    .col{
      flex:1
    }
    .actions{
      margin-top:8px
    }
    .history{
      margin-top:18px
    }
    pre{
      white-space:pre-wrap;
      word-break:break-word;
      background:#f3f4f6;
      padding:12px;
      border-radius:8px
    }
    .small{
      font-size:13px;
      color:var(--card)
    }
    .qr-box{
      text-align:center;
      margin:12px 0
    }
    .qr-box img{
      max-width:200px;
      border-radius:8px
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Hệ thống nạp tiền</h1>
      <div class="tabs">
        <div class="tab active" data-tab="momo">Nạp Momo</div>
        <div class="tab" data-tab="card">Nạp Thẻ</div>
      </div>

      <div id="momo" class="tab-content">
        <div class="qr-box">
          <p>Quét mã QR Momo để chuyển tiền:</p>
          <img src="avatar.png" alt="">
        </div>
        <form id="momoForm">
          <label>Gmail</label>
          <input type="text" id="momoEmail" placeholder="user@gmail.com" required>

          <label>Số tiền (VND)</label>
          <input type="number" id="momoAmount" placeholder="10000" required>

          <label>Nhập Đầy Đủ Thông Tin Sau Đó Nhấn Nạp Rồi Mới Quét Qr<br>
          Lưu Ý:Sau Khi Nhập Thông Tin Và Nhấn Nạp Khi Quét Qr Thêm Ghi Chú<br>
          Mã Tài Khoản Để Nhân Viên Kiểm Tra Và Công TIền Vô Tài Khoản</label>

          <div class="actions">
            <button type="submit">Nạp Momo</button>
          </div>
        </form>

        <div class="history card" style="margin-top:16px;padding:12px">
          <strong>Lịch sử nạp Momo</strong>
          <div id="bankList"></div>
        </div>
      </div>

      <div id="card" class="tab-content" style="display:none">
        <form id="cardForm">
          <label>Gmail</label>
          <input type="text" id="cardEmail" placeholder="ví dụ: user@gmail.com" required>

          <div class="row">
            <div class="col">
              <label>Loại thẻ</label>
              <select id="cardType">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Garena">Garena</option>
              </select>
            </div>
            <div class="col">
              <label>Mệnh giá (VND)</label>
              <input type="number" id="cardAmount" placeholder="10000" required>
            </div>
          </div>

          <label>Mã thẻ</label>
          <input type="text" id="cardCode" placeholder="Mã thẻ">
          <label>Seri thẻ</label>
          <input type="text" id="cardSerial" placeholder="Seri">

          <div class="actions">
            <button type="submit">Nạp Thẻ</button>
          </div>
        </form>

        <div class="history card" style="margin-top:16px;padding:12px">
          <strong>Lịch sử nạp Thẻ</strong>
          <div id="cardList"></div>
        </div>
      </div>
    </div>
  </div>

<script>
const getLS = (k, fallback) => JSON.parse(localStorage.getItem(k) || JSON.stringify(fallback));
const setLS = (k,v) => localStorage.setItem(k, JSON.stringify(v));

if(!localStorage.getItem('bankRecords')) setLS('bankRecords', []);
if(!localStorage.getItem('cardRecords')) setLS('cardRecords', []);
if(!localStorage.getItem('accountBalances')) setLS('accountBalances', {});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', e=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  e.currentTarget.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
  document.getElementById(e.currentTarget.dataset.tab).style.display='block';
}));

function renderBank(){
  const list = getLS('bankRecords', []);
  const el = document.getElementById('bankList');
  if(list.length===0){ el.innerHTML='<div class="small">Chưa có giao dịch.</div>'; return }
  el.innerHTML = list.slice().reverse().map(item=>{
    return `<pre>Thời gian: ${item.time}\nGmail: ${item.email}\nSố tiền: ${item.amount}</pre>`
  }).join('');
}
function renderCard(){
  const list = getLS('cardRecords', []);
  const el = document.getElementById('cardList');
  if(list.length===0){ el.innerHTML='<div class="small">Chưa có giao dịch.</div>'; return }
  el.innerHTML = list.slice().reverse().map(item=>{
    return `<pre>Thời gian: ${item.time}\nGmail: ${item.email}\nLoại thẻ: ${item.type}\nMệnh giá: ${item.amount}\nMã thẻ: ${item.code}\nSeri: ${item.serial}</pre>`
  }).join('');
}
renderBank(); renderCard();

document.getElementById('momoForm').addEventListener('submit', e=>{
  e.preventDefault();
  const email = document.getElementById('momoEmail').value.trim();
  const amount = Number(document.getElementById('momoAmount').value);

  let formData = new FormData();
  formData.append("type","momo");
  formData.append("email", email);
  formData.append("amount", amount);

  fetch("server.php", {method:"POST", body:formData})
  .then(res=>res.json())
  .then(d=>{
    alert(d.message);
    const records = getLS('bankRecords', []);
    records.push({time:new Date().toLocaleString(), email, amount});
    setLS('bankRecords', records);
    renderBank();
  })
  .catch(err=>alert("Lỗi kết nối server"));
});

document.getElementById('cardForm').addEventListener('submit', e=>{
  e.preventDefault();
  const email = document.getElementById('cardEmail').value.trim();
  const type = document.getElementById('cardType').value;
  const code = document.getElementById('cardCode').value.trim();
  const serial = document.getElementById('cardSerial').value.trim();
  const amount = Number(document.getElementById('cardAmount').value);

  let formData = new FormData();
  formData.append("type","card");
  formData.append("email", email);
  formData.append("cardType", type);
  formData.append("code", code);
  formData.append("serial", serial);
  formData.append("amount", amount);

  fetch("server.php", {method:"POST", body:formData})
  .then(res=>res.json())
  .then(d=>{
    alert(d.message);
    const records = getLS('cardRecords', []);
    records.push({time:new Date().toLocaleString(), email, type, code, serial, amount});
    setLS('cardRecords', records);
    renderCard();
  })
  .catch(err=>alert("Lỗi kết nối server"));
});

</script>
</body>
</html>
